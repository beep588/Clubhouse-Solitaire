<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Networked Multiplayer Hub</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #lobby { text-align: center; background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #38bdf8; }
        input { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; margin: 10px 0; text-align: center; }
        button { background: #0284c7; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        #game-container { display: none; text-align: center; }
        canvas { background: #000; border: 2px solid #38bdf8; border-radius: 8px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        .status { margin-top: 15px; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Lobby Menu -->
    <div id="lobby">
        <h1>Networked Arcade</h1>
        <p>Play against a friend on a different device.</p>
        
        <div id="host-section">
            <button onclick="createRoom()">Create Room (Host)</button>
            <p class="status" id="host-status"></p>
        </div>

        <hr style="border-color: #334155; margin: 25px 0;">

        <div id="join-section">
            <input type="text" id="join-id" placeholder="Enter Room ID" autocomplete="off"><br>
            <button onclick="joinRoom()" style="background: #10b981;">Join Room</button>
            <p class="status" id="join-status"></p>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-container">
        <h2 id="game-title">Waiting for opponent...</h2>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <p style="color: #94a3b8;">Controls: W and S keys to move your paddle.</p>
    </div>

    <script>
        let peer = null;
        let connection = null;
        let isHost = false;
        
        // Game State Variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameState = {
            p1y: 200, p2y: 200, ballX: 400, ballY: 250, ballVX: 5, ballVY: 5, score1: 0, score2: 0
        };
        let myY = 200;
        let gameLoopInt;

        // Initialize PeerJS for the Host
        function createRoom() {
            const roomCode = 'hub-' + Math.floor(Math.random() * 9000 + 1000); // Generates hub-XXXX
            document.getElementById('host-status').innerText = "Connecting to server...";
            
            peer = new Peer(roomCode);
            
            peer.on('open', (id) => {
                document.getElementById('host-status').innerHTML = `Room Created! Tell your friend to join: <strong style="color:white; font-size:20px;">${id}</strong>`;
                isHost = true;
            });

            peer.on('connection', (conn) => {
                connection = conn;
                setupConnection();
            });
        }

        // Initialize PeerJS for the Joiner
        function joinRoom() {
            const roomCode = document.getElementById('join-id').value.trim();
            if (!roomCode) return alert("Please enter a Room ID");
            
            document.getElementById('join-status').innerText = "Connecting...";
            peer = new Peer();
            
            peer.on('open', () => {
                connection = peer.connect(roomCode);
                connection.on('open', () => {
                    isHost = false;
                    setupConnection();
                });
            });
        }

        // Handle the live data stream between computers
        function setupConnection() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('game-title').innerText = "Networked Pong - Connected!";

            connection.on('data', (data) => {
                if (isHost) {
                    // Host receives Player 2's paddle position
                    gameState.p2y = data.y;
                } else {
                    // Player 2 receives the entire game state from the Host
                    gameState = data;
                }
            });

            // Start the game loops
            setInterval(sendData, 1000 / 60); // Send updates 60 times a second
            if (isHost) {
                gameLoopInt = setInterval(updatePhysics, 1000 / 60);
            }
            setInterval(drawGame, 1000 / 60);
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') myY = Math.max(0, myY - 20);
            if (e.key === 's' || e.key === 'S') myY = Math.min(canvas.height - 100, myY + 20);
        });

        // Send data over the internet
        function sendData() {
            if (!connection) return;
            if (isHost) {
                gameState.p1y = myY;
                connection.send(gameState);
            } else {
                connection.send({ y: myY });
            }
        }

        // Host handles all the bounce math
        function updatePhysics() {
            gameState.ballX += gameState.ballVX;
            gameState.ballY += gameState.ballVY;

            // Wall bounces
            if (gameState.ballY <= 0 || gameState.ballY >= canvas.height) gameState.ballVY *= -1;

            // Paddle bounces
            if (gameState.ballX <= 30 && gameState.ballY > gameState.p1y && gameState.ballY < gameState.p1y + 100) {
                gameState.ballVX *= -1.05; // Speed up slightly
            }
            if (gameState.ballX >= canvas.width - 30 && gameState.ballY > gameState.p2y && gameState.ballY < gameState.p2y + 100) {
                gameState.ballVX *= -1.05;
            }

            // Scoring
            if (gameState.ballX < 0) { gameState.score2++; resetBall(); }
            if (gameState.ballX > canvas.width) { gameState.score1++; resetBall(); }
        }

        function resetBall() {
            gameState.ballX = canvas.width / 2;
            gameState.ballY = canvas.height / 2;
            gameState.ballVX = 5 * (Math.random() > 0.5 ? 1 : -1);
            gameState.ballVY = 5 * (Math.random() > 0.5 ? 1 : -1);
        }

        // Draw the graphics
        function drawGame() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'white';
            // Draw Paddles
            ctx.fillRect(10, isHost ? myY : gameState.p1y, 20, 100); // Player 1 (Left)
            ctx.fillRect(canvas.width - 30, !isHost ? myY : gameState.p2y, 20, 100); // Player 2 (Right)

            // Draw Ball
            ctx.beginPath();
            ctx.arc(gameState.ballX, gameState.ballY, 10, 0, Math.PI * 2);
            ctx.fill();

            // Draw Score
            ctx.font = '40px Arial';
            ctx.fillText(gameState.score1, 200, 50);
            ctx.fillText(gameState.score2, canvas.width - 200, 50);
            
            // Center Line
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, 0);
            ctx.lineTo(canvas.width/2, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.stroke();
        }
    </script>
</body>
</html>
